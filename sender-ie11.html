<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>G11</title>
<style>
  * { box-sizing: border-box; font-family: "Microsoft JhengHei", "Segoe UI", Arial, sans-serif; }
  body { margin: 0; padding: 12px; background: #18191a; color: #e4e6eb; text-align: center; }
  .container { width: 100%; background: #242526; padding: 14px; border-radius: 12px; text-align: center; }
  h2 { margin: 0 0 8px 0; font-size: 20px; }
  .row { margin: 8px 0; }
  .row label, .row button, .row input { display: inline-block; margin: 4px 5px; vertical-align: middle; }
  input, select, button, textarea { padding: 7px 10px; border-radius: 6px; border: 1px solid #444; background: #3a3b3c; color: #fff; font-size: 14px; }
  button { cursor: pointer; font-weight: bold; }
  button.primary { background: #2e89ff; border: 1px solid #2e89ff; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #qrWrap { background: #fff; padding: 0; border-radius: 6px; display: inline-block; margin: 8px 0; max-width: 100%; overflow: auto; }
  #qrWrap.fs { display: block; width: 100%; height: 100%; max-width: none; margin: 0; border-radius: 0; overflow: hidden; cursor: pointer; }
  #qrWrap.fs canvas { margin: 0 auto; }
  canvas { display: block; }
  .status { font-size: 16px; font-weight: bold; color: #45bd62; margin: 6px 0; }
  .sub-info { font-size: 13px; color: #b0b3b8; margin-bottom: 6px; }
  code { background: #2d2d2d; padding: 2px 6px; border-radius: 4px; color: #ffab40; font-family: Consolas, monospace; word-break: break-all; }
  textarea { width: 100%; }
</style>
</head>
<body>

<div class="container">
  <h2>標準黑白 QR Code 離線傳檔器（IE11 版）</h2>

  <div class="row">
    <input type="file" id="fileInput">
    <label>單張容量:
      <select id="chunkSizeSel">
        <option value="450">450 位元組 (最易掃描)</option>
        <option value="800">800 位元組</option>
        <option value="1200" selected>1200 位元組 (高速輪播建議)</option>
        <option value="2000">2000 位元組 (大螢幕)</option>
        <option value="2900">2900 位元組 (單張 QR 上限，Version 40)</option>
      </select>
    </label>
    <label>每畫面張數:
      <select id="perScreenSel">
        <option value="1">1 張</option>
        <option value="2">2 張</option>
        <option value="4">4 張</option>
        <option value="6">6 張</option>
        <option value="8">8 張</option>
        <option value="12">12 張</option>
        <option value="16">16 張</option>
        <option value="24">24 張 (6x4)</option>
        <option value="28" selected>28 張 (7x4，搭配 1200 位元組)</option>
      </select>
    </label>
  </div>

  <div class="row">
    <label>編碼格式:
      <select id="formatSel">
        <option value="fountain" selected>噴泉碼・二進位 (傳檔案用，最快，不怕漏張)</option>
        <option value="rawtext">純文字直出 (傳一段文字 / 設定檔 / 金鑰，掃了直接讀)</option>
      </select>
    </label>
  </div>

  <div id="statusText" class="status" style="color:#ffab40">程式還沒有執行。如果這行字一直沒變，表示瀏覽器擋掉了這個網頁的指令碼。</div>
  <div id="subInfo" class="sub-info">請看視窗最下方或最上方有沒有「Internet Explorer 已限制這個網頁執行指令碼或 ActiveX 控制項」的提示列，按「允許被封鎖的內容」(Allow blocked content)。沒有提示列時，按 F12 看「文件模式」是不是 11 或 Edge。</div>

  <div class="row">
    <button id="prevBtn" disabled>|&lt; 上一畫面</button>
    <button class="primary" id="playBtn" disabled>自動輪播</button>
    <button id="fsBtn">全螢幕只顯示 QR</button>
    <button id="nextBtn" disabled>下一畫面 &gt;|</button>
    <label>輪播間隔:
      <select id="speedSel">
        <option value="3000">3 秒/畫面</option>
        <option value="1500">1.5 秒/畫面</option>
        <option value="800">0.8 秒/畫面</option>
        <option value="400">0.4 秒/畫面</option>
        <option value="200">0.2 秒/畫面</option>
        <option value="100">0.1 秒/畫面</option>
        <option value="66">0.066 秒/畫面</option>
        <option value="50" selected>0.05 秒/畫面</option>
        <option value="33">0.033 秒/畫面 (每秒 30)</option>
      </select>
    </label>
  </div>

  <div class="row">
    <label>加密密碼:
      <input type="password" id="passBox" size="18" placeholder="留空＝不加密" autocomplete="off">
    </label>
    <label><input type="checkbox" id="passShow"> 顯示</label>
  </div>

  <div id="hashInfo" class="sub-info"></div>

  <div id="qrWrap">
    <canvas id="qrCanvas" width="360" height="360"></canvas>
  </div>

  <div class="row">
    <textarea id="quickText" rows="2" placeholder="或者直接在此貼上要傳到手機的文字 / Config / 金鑰，即時轉成 QR Code..."></textarea>
  </div>

  <!-- 版本 2026-11-13a -->
</div>

<script>
// 任何程式錯誤都直接顯示在畫面上，方便回報
window.onerror = function (msg, url, line) {
  try {
    var el = document.getElementById('statusText'), sub = document.getElementById('subInfo');
    if (el) { el.style.color = '#ff6b6b'; el.innerText = '程式錯誤：' + msg + '（第 ' + line + ' 行）'; }
    if (sub) sub.innerText = '文件模式: ' + (document.documentMode || '非 IE') + ' | ' + navigator.userAgent + ' | 請把這個畫面拍下來回報';
  } catch (e) {}
  return false;
};
(function () {
  var miss = [];
  if (typeof Uint8Array === 'undefined' || typeof Uint32Array === 'undefined') miss.push('Typed Array');
  if (typeof FileReader === 'undefined') miss.push('FileReader');
  if (!document.createElement('canvas').getContext) miss.push('Canvas');
  if (typeof btoa === 'undefined') miss.push('btoa');
  if (miss.length) throw new Error('這個瀏覽器模式缺少 ' + miss.join('、') + '，需要 IE10 以上的文件模式（請關閉相容性檢視）');
})();

/* =====================================================================
   純 ES5 標準 ISO/IEC 18004 QR Code 產生器 (Byte Mode, Error Level L)
   支援 Version 1 ~ 40 (最高 2953 Bytes)，無外部依賴，IE11 可執行
===================================================================== */
/*QR-BEGIN*/
var QR = (function () {
  // Version 1~40、ECC Level L：[每 Block 的 ECC 數, 群組1 Block 數, 群組1 Data 數, 群組2 Block 數, 群組2 Data 數]
  var V_INFO = [
    null,
    [7, 1, 19, 0, 0], [10, 1, 34, 0, 0], [15, 1, 55, 0, 0], [20, 1, 80, 0, 0],
    [26, 1, 108, 0, 0], [18, 2, 68, 0, 0], [20, 2, 78, 0, 0], [24, 2, 97, 0, 0],
    [30, 2, 116, 0, 0], [18, 2, 68, 2, 69], [20, 4, 81, 0, 0], [24, 2, 92, 2, 93],
    [26, 4, 107, 0, 0], [30, 3, 115, 1, 116], [22, 5, 87, 1, 88], [24, 5, 98, 1, 99],
    [28, 1, 107, 5, 108], [30, 5, 120, 1, 121], [28, 3, 113, 4, 114], [28, 3, 107, 5, 108],
    [28, 4, 116, 4, 117], [28, 2, 111, 7, 112], [30, 4, 121, 5, 122], [30, 6, 117, 4, 118],
    [26, 8, 106, 4, 107], [28, 10, 114, 2, 115], [30, 8, 122, 4, 123],
    [30, 3, 117, 10, 118], [30, 7, 116, 7, 117], [30, 5, 115, 10, 116], [30, 13, 115, 3, 116],
    [30, 17, 115, 0, 0], [30, 17, 115, 1, 116], [30, 13, 115, 6, 116], [30, 12, 121, 7, 122],
    [30, 6, 121, 14, 122], [30, 17, 122, 4, 123], [30, 4, 122, 18, 123], [30, 20, 117, 4, 118],
    [30, 19, 118, 6, 119]
  ];

  var ALIGN_POS = [
    null, [], [6,18], [6,22], [6,26], [6,30], [6,34],
    [6,22,38], [6,24,42], [6,26,46], [6,28,50], [6,30,54], [6,32,58], [6,34,62],
    [6,26,46,66], [6,26,48,70], [6,26,50,74], [6,30,54,78], [6,30,56,82], [6,30,58,86], [6,34,62,90],
    [6,28,50,72,94], [6,26,50,74,98], [6,30,54,78,102], [6,28,54,80,106], [6,32,58,84,110], [6,30,58,86,114], [6,34,62,90,118],
    [6,26,50,74,98,122], [6,30,54,78,102,126], [6,26,52,78,104,130], [6,30,56,82,108,134],
    [6,34,60,86,112,138], [6,30,58,86,114,142], [6,34,62,90,118,146],
    [6,30,54,78,102,126,150], [6,24,50,76,102,128,154], [6,28,54,80,106,132,158],
    [6,32,58,84,110,136,162], [6,26,54,82,110,138,166], [6,30,58,86,114,142,170]
  ];

  var MAX_BYTES = 2953;

  // GF(256) 運算表
  var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function () {
    var x = 1, i;
    for (i = 0; i < 255; i++) {
      EXP[i] = x; LOG[x] = i;
      x = (x << 1) ^ ((x & 0x80) ? 0x11D : 0);
    }
    for (i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();

  // 生成多項式各係數的對數 (不含最高次的 1)；係數為 0 時記 -1
  var genCache = {};
  function genLog(deg) {
    if (genCache[deg]) return genCache[deg];
    var g = [1], i, j, res, out = [];
    for (i = 0; i < deg; i++) {
      res = [];
      for (j = 0; j <= g.length; j++) res[j] = 0;
      for (j = 0; j < g.length; j++) {
        res[j] ^= g[j];
        if (g[j]) res[j + 1] ^= EXP[LOG[g[j]] + i];
      }
      g = res;
    }
    for (j = 1; j <= deg; j++) out.push(g[j] ? LOG[g[j]] : -1);
    genCache[deg] = out;
    return out;
  }

  // 對 data[off .. off+len) 算 Reed-Solomon 糾錯碼
  function rsEncode(data, off, len, ecLen) {
    var gl = genLog(ecLen), ec = new Uint8Array(ecLen), i, j, f, lf;
    for (i = 0; i < len; i++) {
      f = data[off + i] ^ ec[0];
      for (j = 0; j < ecLen - 1; j++) ec[j] = ec[j + 1];
      ec[ecLen - 1] = 0;
      if (f) {
        lf = LOG[f];
        for (j = 0; j < ecLen; j++) if (gl[j] >= 0) ec[j] ^= EXP[lf + gl[j]];
      }
    }
    return ec;
  }

  function pickVersion(byteLen) {
    var v, info, totalData, headerBytes;
    for (v = 1; v < V_INFO.length; v++) {
      info = V_INFO[v];
      totalData = info[1] * info[2] + info[3] * info[4];
      headerBytes = (v <= 9) ? 2 : 3;
      if (byteLen + headerBytes <= totalData) return v;
    }
    throw new Error('單張資料過長，請調小單張容量！');
  }

  // 每個 Version 的固定圖樣只算一次：base = 功能圖樣，pos = 資料格的填入順序，mk = 各資料格的遮罩 (Mask 0)
  var tplCache = {};
  function template(ver) {
    if (tplCache[ver]) return tplCache[ver];
    var size = ver * 4 + 17, i, j;
    var base = new Uint8Array(size * size), isFunc = new Uint8Array(size * size);
    function setMod(x, y, val) { base[y * size + x] = val ? 1 : 0; isFunc[y * size + x] = 1; }

    function drawFinder(ox, oy) {
      var dx, dy, x, y, inBox, isBorder, isInner;
      for (dy = -1; dy <= 7; dy++) {
        for (dx = -1; dx <= 7; dx++) {
          x = ox + dx; y = oy + dy;
          if (x < 0 || y < 0 || x >= size || y >= size) continue;
          inBox = (dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6);
          isBorder = (dx === 0 || dx === 6 || dy === 0 || dy === 6);
          isInner = (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
          setMod(x, y, inBox && (isBorder || isInner));
        }
      }
    }
    drawFinder(0, 0); drawFinder(size - 7, 0); drawFinder(0, size - 7);

    for (i = 8; i < size - 8; i++) {
      setMod(i, 6, i % 2 === 0);
      setMod(6, i, i % 2 === 0);
    }

    var apos = ALIGN_POS[ver], pi, pj, px, py, dx, dy;
    for (pi = 0; pi < apos.length; pi++) {
      for (pj = 0; pj < apos.length; pj++) {
        py = apos[pi]; px = apos[pj];
        if ((px === 6 && py === 6) || (px === 6 && py === size - 7) || (px === size - 7 && py === 6)) continue;
        for (dy = -2; dy <= 2; dy++) {
          for (dx = -2; dx <= 2; dx++) {
            setMod(px + dx, py + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
          }
        }
      }
    }

    // Format Info (ECC Level L、Mask 0 → 0x77C4)
    var fmtBits = 0x77C4;
    for (i = 0; i <= 5; i++) setMod(8, i, (fmtBits >>> i) & 1);
    setMod(8, 7, (fmtBits >>> 6) & 1);
    setMod(8, 8, (fmtBits >>> 7) & 1);
    setMod(7, 8, (fmtBits >>> 8) & 1);
    for (i = 9; i < 15; i++) setMod(14 - i, 8, (fmtBits >>> i) & 1);
    for (i = 0; i < 8; i++) setMod(size - 1 - i, 8, (fmtBits >>> i) & 1);
    for (i = 8; i < 15; i++) setMod(8, size - 15 + i, (fmtBits >>> i) & 1);
    setMod(8, size - 8, 1); // Dark module

    // Version 資訊 (Version 7 以上)
    if (ver >= 7) {
      var rem = ver;
      for (i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      var vBits = (ver << 12) | rem, bit, a, c;
      for (i = 0; i < 18; i++) {
        bit = (vBits >>> i) & 1;
        a = size - 11 + (i % 3); c = Math.floor(i / 3);
        setMod(a, c, bit); setMod(c, a, bit);
      }
    }

    // 資料格的走訪順序
    var pos = [], mk = [], up = true, right, vert, x, y;
    for (right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (vert = 0; vert < size; vert++) {
        y = up ? (size - 1 - vert) : vert;
        for (j = 0; j < 2; j++) {
          x = right - j;
          if (!isFunc[y * size + x]) { pos.push(y * size + x); mk.push(((x + y) % 2 === 0) ? 1 : 0); }
        }
      }
      up = !up;
    }
    tplCache[ver] = { size: size, base: base, pos: pos, mk: mk };
    return tplCache[ver];
  }

  // bytes: 0~255 的陣列或 Uint8Array；回傳 { n: 邊長, m: Uint8Array(n*n)，m[y*n+x] = 0/1 }
  function encodeFlat(bytes) {
    var L = bytes.length, ver = pickVersion(L);
    var info = V_INFO[ver];
    var ecLen = info[0], g1 = info[1], d1 = info[2], g2 = info[3], d2 = info[4];
    var totalData = g1 * d1 + g2 * d2, nb = g1 + g2;
    var i, k, b, prev, used, p;

    // 1. 資料碼字：模式 0100 + 長度 (8 或 16 bit) + 資料 + 結束符，整體錯開半個位元組
    var dw = new Uint8Array(totalData);
    if (ver <= 9) { dw[0] = 0x40 | (L >>> 4); p = 1; }
    else { dw[0] = 0x40 | (L >>> 12); dw[1] = (L >>> 4) & 255; p = 2; }
    prev = L & 15;
    for (i = 0; i < L; i++) { b = bytes[i]; dw[p + i] = (prev << 4) | (b >>> 4); prev = b & 15; }
    dw[p + L] = prev << 4;
    used = p + L + 1;
    for (i = used, k = 0; i < totalData; i++, k++) dw[i] = (k % 2 === 0) ? 0xEC : 0x11;

    // 2. 分 Block 算糾錯碼，3. 交錯排列
    var offs = [], lens = [], ecs = [], off = 0;
    for (k = 0; k < nb; k++) {
      lens[k] = (k < g1) ? d1 : d2;
      offs[k] = off; off += lens[k];
      ecs[k] = rsEncode(dw, offs[k], lens[k], ecLen);
    }
    var fw = new Uint8Array(totalData + nb * ecLen), maxLen = Math.max(d1, d2);
    p = 0;
    for (i = 0; i < maxLen; i++) for (k = 0; k < nb; k++) if (i < lens[k]) fw[p++] = dw[offs[k] + i];
    for (i = 0; i < ecLen; i++) for (k = 0; k < nb; k++) fw[p++] = ecs[k][i];

    // 4. 填進樣板
    var t = template(ver), m = new Uint8Array(t.base), pos = t.pos, mk = t.mk;
    var totalBits = fw.length * 8, np = pos.length;
    for (i = 0; i < np; i++) {
      m[pos[i]] = ((i < totalBits) ? ((fw[i >>> 3] >>> (7 - (i & 7))) & 1) : 0) ^ mk[i];
    }
    return { n: t.size, m: m };
  }

  // 回傳 size x size 的 0/1 二維陣列 (mat[y][x])
  function encodeBytes(bytes) {
    var q = encodeFlat(bytes), n = q.n, rows = [], y, x, row;
    for (y = 0; y < n; y++) {
      row = [];
      for (x = 0; x < n; x++) row.push(q.m[y * n + x]);
      rows.push(row);
    }
    return rows;
  }

  return { encodeBytes: encodeBytes, encodeFlat: encodeFlat, MAX_BYTES: MAX_BYTES };
})();

/* ================== 切片 (與畫面無關，可單獨測試) ================== */
function strToUtf8(str) {
  var s, out = [], i;
  try { s = unescape(encodeURIComponent(str)); }
  catch (e) { s = unescape(encodeURIComponent(str.replace(/[\uD800-\uDFFF]/g, '?'))); }
  for (i = 0; i < s.length; i++) out.push(s.charCodeAt(i));
  return out;
}

// 整檔 CRC32 (8 位十六進位)，給接收端核對用
function crc32Hex(bytes) {
  var table = crc32Hex.table, c, n, k, i, crc = -1, hex;
  if (!table) {
    table = [];
    for (n = 0; n < 256; n++) {
      c = n;
      for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c;
    }
    crc32Hex.table = table;
  }
  for (i = 0; i < bytes.length; i++) crc = table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  hex = ((crc ^ -1) >>> 0).toString(16).toUpperCase();
  while (hex.length < 8) hex = '0' + hex;
  return hex;
}

function bytesToBase64(bytes) {
  var parts = [], i, j, end, s;
  for (i = 0; i < bytes.length; i += 8190) {   // 8190 是 3 的倍數，分段編碼可直接相接
    end = Math.min(i + 8190, bytes.length);
    s = '';
    for (j = i; j < end; j++) s += String.fromCharCode(bytes[j]);
    parts.push(btoa(s));
  }
  return parts.join('');
}

// 回傳 { chunks: [位元組陣列...], fmt: 實際使用的格式, note: 提示文字 }
function buildChunks(fileBytes, fileName, fileMime, fmt, maxLen, perScreen) {
  var MAXB = QR.MAX_BYTES;
  var chunks = [], note = '', i, b64, total, part, hdr, partLen, tries;
  if (maxLen > MAXB) maxLen = MAXB;

  if (fmt === 'dataurl') {
    var dataUrl = strToUtf8('data:' + fileMime + ';base64,' + bytesToBase64(fileBytes));
    if (dataUrl.length > MAXB) {
      note = 'DataURL 長度 ' + dataUrl.length + ' 位元組，超過單張上限 ' + MAXB + '，已改用帶頁碼標籤。';
      fmt = 'tagged';
    } else {
      chunks.push(dataUrl);
      return { chunks: chunks, fmt: fmt, note: note };
    }
  }

  if (fmt === 'b64' && perScreen > 1) {
    note = '每畫面多張時掃描順序不固定，已改用帶頁碼標籤。';
    fmt = 'tagged';
  }

  if (fmt === 'rawtext') {
    // 直接切位元組，但不把一個 UTF-8 字元切成兩半
    var pos = 0, end, back;
    while (pos < fileBytes.length) {
      end = Math.min(pos + maxLen, fileBytes.length);
      back = 0;
      while (end < fileBytes.length && back < 3 && end > pos + 1 && (fileBytes[end] & 0xC0) === 0x80) { end--; back++; }
      part = [];
      for (i = pos; i < end; i++) part.push(fileBytes[i]);
      chunks.push(part);
      pos = end;
    }
    return { chunks: chunks, fmt: fmt, note: note };
  }

  b64 = bytesToBase64(fileBytes);
  if (fmt === 'tagged') {
    var nameBytes = strToUtf8(fileName).length;
    partLen = maxLen;
    for (tries = 0; tries < 4; tries++) {
      total = Math.ceil(b64.length / partLen) || 1;
      hdr = String(total).length * 2 + 3 + nameBytes;   // "頁/總頁|檔名|"
      if (partLen + hdr <= MAXB) break;
      partLen = MAXB - hdr - 2;
      if (partLen < 16) throw new Error('檔名太長，請先改短檔名。');
    }
    total = Math.ceil(b64.length / partLen) || 1;
    for (i = 0; i < total; i++) {
      chunks.push(strToUtf8((i + 1) + '/' + total + '|' + fileName + '|' + b64.substr(i * partLen, partLen)));
    }

      $('quickText').value = '';
      if ($('formatSel').value === 'rawtext') $('formatSel').value = 'fountain';
      rebuildChunks();
    };
    reader.onerror = function () { alert('讀取檔案失敗'); };
    reader.readAsArrayBuffer(f);
  };

  function fromTextInput() {
    var txt = $('quickText').value;
    if (!txt) return;
    rawFileName = 'snippet.txt';
    rawFileMime = 'text/plain';
    rawFileBytes = strToUtf8(txt);
    $('formatSel').value = 'rawtext';
    rebuildChunks();
  }

  function rebuildChunks() {
    if (!rawFileBytes || rawFileBytes.length === 0) return;
    stopPlay();
    var fmt = $('formatSel').value;
    var pass = $('passBox') ? $('passBox').value : '';
    var encrypting = pass.length > 0;
    var isFountain = (fmt === 'fountain' || fmt === 'fountaintxt') || encrypting;
    if (isFountain && prepFor !== rawFileBytes) {
      // 第一次用噴泉碼傳這個檔：先算 SHA-256、試壓縮，做完再回來
      var target = rawFileBytes;
      fountain = null; chunks = []; active = [];
      setText('statusText', rawFileName + ' — 準備中（計算 SHA-256' + (canGzip() ? '、試壓縮' : '') + '）…');
      setText('subInfo', '原始大小: ' + rawFileBytes.length + ' Bytes');
      setText('hashInfo', '');
      $('prevBtn').disabled = true; $('nextBtn').disabled = true; $('playBtn').disabled = true;
      setTimeout(function () {
        prepare(target, function (r) {
          if (rawFileBytes !== target) return;
          prep = r; prepFor = target;
          rebuildChunks();
        });
      }, 30);
      return;
    }
    if (encrypting) {
      setText('statusText', rawFileName + ' — 加密中…');
      setText('subInfo', '原始大小: ' + rawFileBytes.length + ' Bytes');
      $('prevBtn').disabled = true; $('nextBtn').disabled = true; $('playBtn').disabled = true;
      setTimeout(buildNow, 30);
    } else {
      buildNow();
    }
  }

  function buildNow() {
    var maxLen = parseInt($('chunkSizeSel').value, 10);
    var fmt = $('formatSel').value;
    perScreen = parseInt($('perScreenSel').value, 10);
    var pass = $('passBox') ? $('passBox').value : '';
    var passBytes = pass.length ? utf8Bytes(pass) : null;
    var useFountain = (fmt === 'fountain' || fmt === 'fountaintxt') || !!passBytes;
    try {
      if (useFountain) {
        fountain = fountainSetup(rawFileBytes, rawFileName, maxLen, (fmt === 'fountaintxt') && !passBytes, prep, passBytes);
        chunks = []; buildNote = '';
      } else {
        var res = buildChunks(rawFileBytes, rawFileName, rawFileMime, fmt, maxLen, perScreen);
        fountain = null;
        chunks = res.chunks;
        buildNote = res.note;
        $('formatSel').value = res.fmt;
      }
    } catch (err) {
      alert(err.message);
      setText('statusText', rawFileName + '（建立失敗：' + err.message + '）');
      return;
    }
    matCache = [];
    setAllActive();
    rawCrc = crc32Hex(rawFileBytes);
    curScreen = 0;
    var hi = '';
    if (fountain && prep && prep.sha) {
      hi = 'SHA-256: ' + bytesToHex(prep.sha);
      if (prep.gz) hi += '｜已壓縮 ' + rawFileBytes.length + ' → ' + prep.gz.length + ' Bytes（' + (prep.gz.length * 100 / rawFileBytes.length).toFixed(1) + '%）';
      else if (canGzip()) hi += '｜壓縮後沒有明顯變小，照原樣傳';
    }
    if (fountain && fountain.encrypted) hi = '【已加密】ChaCha20＋PBKDF2｜手機端需輸入相同密碼才能解開｜' + hi;
    setText('hashInfo', hi);
    resetPace();
    updateUI();
  }
  function canGzip() {
    return typeof CompressionStream !== 'undefined' && typeof Response !== 'undefined' && typeof Blob !== 'undefined' &&
           typeof Promise !== 'undefined' && !!(window.Blob && Blob.prototype.stream);
  }

  // 算 SHA-256 並試 gzip；兩件事都做完才呼叫 done({ sha, gz })
  function prepare(bytes, done) {
    var gen = ++prepGen, res = { sha: null, gz: null }, pending = 1;
    var u8 = bytes.subarray ? bytes : new Uint8Array(bytes);
    function fin() { if (--pending === 0 && gen === prepGen) done(res); }
    var subtle = window.crypto && window.crypto.subtle, viaSubtle = false;
    if (subtle && typeof Promise !== 'undefined') {
      try {
        pending++;
        subtle.digest('SHA-256', u8).then(function (h) { res.sha = new Uint8Array(h); fin(); },
                                          function () { res.sha = sha256(u8); fin(); });
        viaSubtle = true;
      } catch (e) { pending--; }
    }
    if (!viaSubtle) res.sha = sha256(u8);
    if (canGzip() && u8.length >= 64) {
      try {
        pending++;
        new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer().then(function (ab) {
          var g = new Uint8Array(ab);
          if (g.length < u8.length * 0.97) res.gz = g;     // 省不到 3% 就不壓
          fin();
        }, function () { fin(); });
      } catch (e2) { pending--; }
    }
    fin();
  }

  function getMat(idx) {
    if (chunks.length > 300) return QR.encodeFlat(chunks[idx]);   // 張數多時不快取，避免吃光記憶體
    if (!matCache[idx]) matCache[idx] = QR.encodeFlat(chunks[idx]);
    return matCache[idx];
  }

  // 目前這個畫面要顯示的 QR ({ n, m })
  function screenMats() {
    var mats = [], i, first = curScreen * perScreen;
    if (fountain) {
      for (i = 0; i < perScreen; i++) mats.push(QR.encodeFlat(fountainFrame(fountain, first + i)));
    } else {
      var last = Math.min(first + perScreen, active.length);
      for (i = first; i < last; i++) mats.push(getMat(active[i]));
    }
    return mats;
  }

  function setCrisp(c) {
    c.imageSmoothingEnabled = false;
    c.msImageSmoothingEnabled = false;
    c.webkitImageSmoothingEnabled = false;
    c.mozImageSmoothingEnabled = false;
  }

  // 不透明黑色在 32 位元像素裡的值 (依位元組順序而定)
  var PX_BLACK = (new Uint8Array(new Uint32Array([1]).buffer)[0] === 1) ? 0xFF000000 : 0x000000FF;
  var tmpCache = {};
  function tmpFor(n) {
    if (!tmpCache[n]) {
      var cv = document.createElement('canvas');
      cv.width = n; cv.height = n;
      var cx = cv.getContext('2d'), img = cx.createImageData(n, n), d = img.data, i;
      for (i = 3; i < d.length; i += 4) d[i] = 255;
      var u32 = null;
      try { if (d.buffer && d.buffer.byteLength === n * n * 4) u32 = new Uint32Array(d.buffer); } catch (e) { u32 = null; }
      tmpCache[n] = { cv: cv, cx: cx, img: img, u32: u32 };
    }
    return tmpCache[n];
  }

  // 這個瀏覽器放大小圖時能不能保持銳利 (不能的話退回逐格畫)
  var crisp = null;
  function crispWorks() {
    if (crisp !== null) return crisp;
    try {
      var t = tmpFor(2), d = t.img.data, c = document.createElement('canvas'), x, p;
      d[0] = d[1] = d[2] = 0; d[4] = d[5] = d[6] = 255; d[8] = d[9] = d[10] = 255; d[12] = d[13] = d[14] = 0;
      t.cx.putImageData(t.img, 0, 0);
      c.width = 16; c.height = 16;
      x = c.getContext('2d'); setCrisp(x);
      x.drawImage(t.cv, 0, 0, 16, 16);
      p = x.getImageData(0, 0, 16, 16).data;
      // 交界左右各一像素：(7,3) 應全黑、(8,3) 應全白
      crisp = (p[(3 * 16 + 7) * 4] === 0 && p[(3 * 16 + 8) * 4] === 255 && p[(12 * 16 + 7) * 4] === 255 && p[(12 * 16 + 8) * 4] === 0);
    } catch (e) { crisp = false; }
    return crisp;
  }

  function drawCode(q, ox, oy, scale) {
    var n = q.n, m = q.m, i, x, y, runStart, total = n * n;
    if (crispWorks()) {
      var t = tmpFor(n), d = t.img.data, u = t.u32, v, j = 0;
      if (u) { for (i = 0; i < total; i++) u[i] = m[i] ? PX_BLACK : 0xFFFFFFFF; }
      else { for (i = 0; i < total; i++, j += 4) { v = m[i] ? 0 : 255; d[j] = v; d[j + 1] = v; d[j + 2] = v; } }
      t.cx.putImageData(t.img, 0, 0);
      ctx.drawImage(t.cv, 0, 0, n, n, ox, oy, n * scale, n * scale);
      return;
    }
    for (y = 0; y < n; y++) {
      runStart = -1;
      for (x = 0; x <= n; x++) {
        if (x < n && m[y * n + x]) {
          if (runStart < 0) runStart = x;
        } else if (runStart >= 0) {
          ctx.fillRect(ox + runStart * scale, oy + y * scale, (x - runStart) * scale, scale);
          runStart = -1;
        }
      }
    }
  }

  function renderScreen() {
    var tA = nowMs();
    var mats = screenMats(), i, nMax = 0;
    var tB = nowMs();
    for (i = 0; i < mats.length; i++) if (mats[i].n > nMax) nMax = mats[i].n;
    var QUIET = 4;
    var cellMods = nMax + QUIET * 2;
    var fsOn = isFs();
    var availW = Math.max(300, (window.innerWidth || document.documentElement.clientWidth) - (fsOn ? 4 : 60));
    var availH = Math.max(300, (window.innerHeight || document.documentElement.clientHeight) - (fsOn ? 4 : 30));

    // 版面用「每畫面張數」決定 (最後一個畫面張數較少時版面不跳動)，挑每格像素最大的排法
    var slots = fountain ? perScreen : Math.min(perScreen, active.length);
    var best = { scale: -1, cols: 1, rows: 1, slots: 0 }, cols, rows, sc;
    for (cols = 1; cols <= slots; cols++) {
      rows = Math.ceil(slots / cols);
      sc = Math.floor(Math.min(availW / cols, availH / rows) / cellMods);
      if (sc > best.scale ||
          (sc === best.scale && (cols * rows - slots < best.cols * best.rows - best.slots ||
            (cols * rows - slots === best.cols * best.rows - best.slots &&
             Math.abs(cols / rows - 1.78) < Math.abs(best.cols / best.rows - 1.78))))) {
        best = { scale: sc, cols: cols, rows: rows, slots: slots };
      }
    }
    var scale = Math.min(10, Math.max(2, best.scale));
    var cell = cellMods * scale;
    var cw = best.cols * cell, ch = best.rows * cell;
    if (canvas.width !== cw) canvas.width = cw;
    if (canvas.height !== ch) canvas.height = ch;
    setCrisp(ctx);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = '#000000';
    for (i = 0; i < mats.length; i++) {
      drawCode(mats[i],
        (i % best.cols) * cell + Math.floor((cell - mats[i].n * scale) / 2),
        Math.floor(i / best.cols) * cell + Math.floor((cell - mats[i].n * scale) / 2),
        scale);
    }
    accEnc += tB - tA; accDraw += nowMs() - tB;
    canvas.style.marginTop = fsOn ? Math.max(0, Math.floor((availH - ch) / 2)) + 'px' : '';
    return { scale: scale, version: (nMax - 17) / 4, fits: (cw <= availW + 4 && ch <= availH + 4), cols: best.cols, rows: best.rows };
  }

  function updateUI(force) {
    if (!hasData()) return;
    var info;
    try { info = renderScreen(); }
    catch (err) { stopPlay(); alert(err.message); return; }
    var tn = nowMs();
    if (playing && !force && tn - lastText < 300) return;
    lastText = tn;
    var first = curScreen * perScreen, sub, single;
    if (fountain) {
      var range = (perScreen > 1) ? ((first + 1) + '–' + (first + perScreen)) : String(first + 1);
      var tail = (first >= fountain.N) ? '（原文已播完一輪，持續播補償碼，手機顯示收齊即可停）' : '';
      setText('statusText', rawFileName + ' — 噴泉碼 第 ' + range + ' 張｜原文共 ' + fountain.N + ' 塊' + tail);
      sub = '原始大小: ' + rawFileBytes.length + ' Bytes | CRC32: ' + rawCrc + ' | 每張資料: ' + fountain.K + ' Bytes';
      single = false;
    } else {
      var last = Math.min(first + perScreen, active.length);
      var nums = [], k;
      for (k = first; k < last; k++) nums.push(active[k] + 1);
      var pageTxt = '第 ' + nums.join('、') + ' 張 / 共 ' + chunks.length + ' 張';
      var partial = (active.length < chunks.length) ? '｜補播 ' + active.length + ' 張' : '';
      setText('statusText', rawFileName + ' — ' + pageTxt + '（畫面 ' + (curScreen + 1) + ' / ' + screenCount() + partial + '）');
      sub = '原始大小: ' + rawFileBytes.length + ' Bytes | CRC32: ' + rawCrc + ' | 本張: ' + chunks[active[first]].length + ' Bytes';
      single = (screenCount() <= 1);
    }
    sub += ' | QR Version ' + info.version + ' | 每格 ' + info.scale + ' 像素';
    if (perScreen > 1) sub += '（' + info.cols + 'x' + info.rows + '）';
    if (!info.fits) sub += '【畫面放不下：請按「全螢幕只顯示 QR」，或減少每畫面張數】';
    if (rateTxt) sub += ' | ' + rateTxt;
    if (buildNote) sub += ' | ' + buildNote;
    setText('subInfo', sub);
    $('prevBtn').disabled = single;
    $('nextBtn').disabled = single;
    $('playBtn').disabled = single;
  }

  function prevScreen() {
    if (!hasData()) return;
    if (fountain) curScreen = Math.max(0, curScreen - 1);
    else curScreen = (curScreen - 1 + screenCount()) % screenCount();
    updateUI();
  }

  function nextScreen() {
    if (!hasData()) return;
    if (fountain) curScreen = ((curScreen + 2) * perScreen > MAX_SEED) ? 0 : curScreen + 1;
    else curScreen = (curScreen + 1) % screenCount();
    updateUI();
  }

  function nowMs() {
    return (window.performance && performance.now) ? performance.now() : new Date().getTime();
  }

  var playing = false, lastText = 0, loopTimer = null, loopGen = 0;
  var rateT = 0, rateN = 0, rateTxt = '', accEnc = 0, accDraw = 0;
  var isIE = !!document.documentMode;
  var rafFn = window.requestAnimationFrame || null;
  // 換頁計時有兩種：'raf' 跟著螢幕更新走 (不會撕裂，但有些環境節拍很慢)、'timer' 用計時器。
  // 開始輪播後每 2 秒量一次實際速度，達不到設定值就換另一種試試，兩種都試過就留下快的那一種。
  var pace = { mode: 'timer', tried: {}, locked: true };
  var nextDue = 0, rafPrev = 0, rafPeriod = 16.7, rafLastShow = 0, rafSeen = 0;

  function resetPace() {
    pace.mode = (rafFn && !isIE) ? 'raf' : 'timer';
    pace.tried = {};
    pace.locked = !rafFn;
  }

  function stopPlay() {
    playing = false;
    loopGen++;
    if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
    rateT = 0; rateN = 0; rateTxt = '';
    setText('playBtn', '自動輪播');
  }

  function speedMs() { return parseInt($('speedSel').value, 10); }

  function choosePace(achieved, target) {
    pace.tried[pace.mode] = achieved;
    if (achieved >= target * 0.92) { pace.locked = true; return; }
    var other = (pace.mode === 'raf') ? 'timer' : 'raf';
    if (pace.tried[other] === undefined) { pace.mode = other; startLoop(); return; }
    var best = (pace.tried.raf >= pace.tried.timer) ? 'raf' : 'timer';
    pace.locked = true;
    if (best !== pace.mode) { pace.mode = best; startLoop(); }
  }

  // 換到下一個畫面並畫出來
  function showNext(now) {
    if (fountain) curScreen = ((curScreen + 2) * perScreen > MAX_SEED) ? 0 : curScreen + 1;
    else curScreen = (curScreen + 1) % screenCount();
    rateN++;
    if (!rateT) { rateT = now; rateN = 0; accEnc = 0; accDraw = 0; }
    else if (now - rateT >= 2000 && rateN > 0) {
      var achieved = rateN * 1000 / (now - rateT);
      rateTxt = '實際每秒 ' + achieved.toFixed(1) + ' 畫面（' + (pace.mode === 'raf' ? '螢幕同步' : '計時器') + '；每畫面編碼 ' +
                (accEnc / rateN).toFixed(0) + ' ms、畫圖 ' + (accDraw / rateN).toFixed(0) + ' ms）';
      rateT = now; rateN = 0; accEnc = 0; accDraw = 0;
      if (!pace.locked) choosePace(achieved, 1000 / speedMs());
    }
    updateUI(false);
  }

  // 計時器：照「理想時間表」換頁，某一次晚到，下一次的等待就縮短；畫不完時一張接一張畫，不累積欠帳
  function timerLoop(gen) {
    if (gen !== loopGen || !playing) return;
    var now = nowMs(), ms = speedMs();
    if (now >= nextDue - 2) {
      nextDue += ms;
      if (nextDue < now) nextDue = now;
      showNext(now);
      if (gen !== loopGen) return;      // showNext 可能換了計時方式
      now = nowMs();
    }
    var wait = nextDue - now;
    loopTimer = setTimeout(function () { timerLoop(gen); }, wait < 1 ? 1 : wait);
  }

  // 螢幕同步：每個畫面停留整數個螢幕更新週期
  function rafLoop(ts, gen) {
    if (gen !== loopGen || !playing) return;
    rafSeen = nowMs();
    var dt = ts - rafPrev;
    if (rafPrev && dt > 3 && dt < 60) rafPeriod = rafPeriod * 0.9 + dt * 0.1;
    rafPrev = ts;
    var hold = Math.max(1, Math.round(speedMs() / rafPeriod));
    if (!rafLastShow || ts - rafLastShow >= hold * rafPeriod - rafPeriod * 0.5) {
      rafLastShow = ts;
      showNext(rafSeen);
      if (gen !== loopGen) return;
    }
    rafFn.call(window, function (t) { rafLoop(t, gen); });
  }

  // 視窗被遮住或最小化時螢幕同步不會跑：改用計時器
  function rafWatchdog(gen) {
    if (gen !== loopGen || !playing || pace.mode !== 'raf') return;
    if (nowMs() - rafSeen > 400) { pace.tried.raf = 0; pace.mode = 'timer'; startLoop(); return; }
    loopTimer = setTimeout(function () { rafWatchdog(gen); }, 500);
  }

  function startLoop() {
    var gen = ++loopGen;
    if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
    rateT = 0; rateN = 0;
    if (pace.mode === 'raf' && rafFn) {
      rafPrev = 0; rafLastShow = 0; rafSeen = nowMs();
      rafFn.call(window, function (t) { rafLoop(t, gen); });
      loopTimer = setTimeout(function () { rafWatchdog(gen); }, 500);
    } else {
      pace.mode = 'timer';
      nextDue = nowMs() + speedMs();
      loopTimer = setTimeout(function () { timerLoop(gen); }, 1);
    }
  }

  function togglePlay() {
    if (playing) {
      stopPlay();
      updateUI(true);
    } else if (hasData()) {
      playing = true;
      setText('playBtn', '暫停輪播');
      startLoop();
    }
  }

  $('speedSel').onchange = function () { resetPace(); if (playing) startLoop(); };
  var wrapEl = $('qrWrap');
  function isFs() {
    return (document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement) === wrapEl;
  }
  function enterFs() {
    var fn = wrapEl.requestFullscreen || wrapEl.webkitRequestFullscreen || wrapEl.msRequestFullscreen;
    if (!fn) { alert('這個瀏覽器不支援全螢幕，請改按 F11 並把頁面捲到 QR 的位置。'); return; }
    try { fn.call(wrapEl); } catch (e) { alert('無法進入全螢幕：' + e.message); }
  }
  function onFsChange() {
    wrapEl.className = isFs() ? 'fs' : '';
    setTimeout(function () { if (hasData()) updateUI(true); }, 80);
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
  document.addEventListener('MSFullscreenChange', onFsChange);
  $('fsBtn').onclick = enterFs;
  wrapEl.onclick = function () { if (isFs()) togglePlay(); };
  document.onkeydown = function (e) {
    e = e || window.event;
    if (!isFs()) return;
    if (e.keyCode === 32) { togglePlay(); if (e.preventDefault) e.preventDefault(); return false; }
    if (e.keyCode === 37) prevScreen();
    if (e.keyCode === 39) nextScreen();
  };

  $('prevBtn').onclick = prevScreen;
  $('nextBtn').onclick = nextScreen;
  $('playBtn').onclick = togglePlay;
  $('chunkSizeSel').onchange = rebuildChunks;
  $('passBox').onchange = rebuildChunks;
  $('passShow').onchange = function () { $('passBox').type = $('passShow').checked ? 'text' : 'password'; };
  $('perScreenSel').onchange = rebuildChunks;
  $('formatSel').onchange = rebuildChunks;
  $('quickText').oninput = fromTextInput;
  $('quickText').onkeyup = fromTextInput;   // IE 的 input 事件在刪除字元時不一定觸發
  $('quickText').onpaste = function () { setTimeout(fromTextInput, 0); };

  var resizeTimer = null;
  window.onresize = function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (hasData()) updateUI(); }, 150);
  };

  $('statusText').style.color = '';
  resetPace();
  // 預設展示一張歡迎 QR Code
  $('quickText').value = 'Hello from Windows Server Offline QR Sender!';
  fromTextInput();
  // 歡迎畫面是純文字，但選單要停在選檔後實際會用的格式，免得看起來像預設是純文字
  $('formatSel').value = 'fountain';
})();
</script>
</body>
</html>
